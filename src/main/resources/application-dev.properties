# Development profile - H2 in-memory database (no external dependencies needed)
spring.application.name=fragrance-tracker

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:fragrancedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Console (optional - for debugging database)
spring.h2.console.enabled=true

# SSL disabled for local development
server.ssl.enabled=false
server.port=8080

# Static resources
spring.web.resources.static-locations=file:${user.home}/le-webroot/,classpath:/static/
