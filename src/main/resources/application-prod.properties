spring.application.name=fragrance-tracker

# MariaDB/MySQL database configuration (as per teacher's template)
spring.datasource.url=jdbc:mysql://localhost:3306/fragrancedb?useSSL=true&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=maab
spring.datasource.password=password
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update

# JPA Hibernate settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SSL/HTTPS configuration
server.ssl.enabled=true
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=interlude224
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot

# Static resources
spring.web.resources.static-locations=file:${user.home}/le-webroot/,classpath:/static/