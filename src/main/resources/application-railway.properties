# Railway Production Profile Configuration
# Inherit from prod profile and add Railway-specific settings

# Explicitly include prod profile
spring.profiles.include=prod

# ============================================
# TOMCAT REVERSE PROXY CONFIGURATION
# ============================================
# Trust X-Forwarded-* headers from Railway reverse proxy
# This ensures redirects use HTTPS and correct host
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.protocol-header-https-value=https
