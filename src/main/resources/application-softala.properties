# Softala Profile for Production on Softala Server
# MySQL configuration for Softala deployment

# ============================================
# DATABASE CONFIGURATION (Softala MySQL)
# ============================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/maab?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=maab
spring.datasource.password=password
spring.sql.init.mode=always
spring.batch.jdbc.initialize-schema=always

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# SERVER CONFIGURATION
# ============================================

server.port=7074

# SSL/HTTPS Configuration
server.ssl.enabled=true
server.ssl.key-store=/etc/ssl/private/springboot-example.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# ============================================
# APPLICATION CONFIGURATION
# ============================================

spring.application.name=fragrance-tracker

# Logging
logging.level.root=WARN
logging.level.com.maab.fragrance_tracker=INFO

# REST API
spring.data.rest.base-path=/api

# ============================================
# OAUTH2 CONFIGURATION
# ============================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login
