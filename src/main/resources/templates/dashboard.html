<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Fragrance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🎵 Fragrance Tracker</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h1>Welcome to Your Dashboard!</h1>
        <p>Your fragrance tracker application is working!</p>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">My Collection</h5>
                        <p class="card-text">View and manage your perfume collection</p>
                        <a th:href="@{/perfumes}" class="btn btn-primary">View Collection</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Add Perfume</h5>
                        <p class="card-text">Add a new perfume to your collection</p>
                        <a th:href="@{/perfumes/add}" class="btn btn-success">Add New</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Discover</h5>
                        <p class="card-text">Find new fragrances</p>
                        <a href="#" class="btn btn-info">Browse</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
