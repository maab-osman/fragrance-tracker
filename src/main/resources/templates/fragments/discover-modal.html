<!— discover modal fragment —>
<div th:fragment="discoverModal">
  <div class="modal fade" id="discoverModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Discover perfumes</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <div class="btn-group" role="group">
              <button type="button" class="btn btn-sm btn-outline-primary" data-mode="recommended">Recommended</button>
              <button type="button" class="btn btn-sm btn-outline-primary" data-mode="trending">Trending</button>
              <button type="button" class="btn btn-sm btn-outline-primary" data-mode="random">Random</button>
            </div>
          </div>

          <div id="discoverContent">
            <div class="text-center py-5">Loading…</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
