<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragrance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <h1 class="mb-4">🎵 Fragrance Tracker</h1>
                <p class="lead">Track your perfume collection and discover new scents</p>
                <div class="mt-4">
                    <a th:href="@{/login}" class="btn btn-primary me-2">Login</a>
                    <a th:href="@{/register}" class="btn btn-outline-primary">Register</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
