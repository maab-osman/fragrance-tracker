<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Fragrance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h2 class="text-center mb-4">Login to Fragrance Tracker</h2>
                
                <!-- Show success message if registered -->
                <div th:if="${param.registered}" class="alert alert-success">
                    Registration successful! Please login.
                </div>
                
                <!-- Show error message if login fails -->
                <div th:if="${param.error}" class="alert alert-danger">
                    Invalid username or password.
                </div>
                
                <!-- Show message if logged out -->
                <div th:if="${param.logout}" class="alert alert-success">
                    You have been logged out successfully.
                </div>
                
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                
                <div class="text-center mt-3">
                    <a th:href="@{/}">Back to Home</a> | 
                    <a th:href="@{/register}">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
