<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Perfume</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">🎵 Fragrance Tracker</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/perfumes}">My Collection</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="mb-4">Add New Perfume</h1>
                
                <form th:action="@{/perfumes/add}" th:object="${perfume}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Perfume Name *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="brand" class="form-label">Brand *</label>
                            <input type="text" class="form-control" id="brand" th:field="*{brand}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="season" class="form-label">Season</label>
                            <select class="form-select" id="season" th:field="*{season}">
                                <option value="">Select Season</option>
                                <option th:each="season : ${seasons}" 
                                        th:value="${season}" 
                                        th:text="${season}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="occasion" class="form-label">Occasion</label>
                            <select class="form-select" id="occasion" th:field="*{occasion}">
                                <option value="">Select Occasion</option>
                                <option th:each="occasion : ${occasions}" 
                                        th:value="${occasion}" 
                                        th:text="${occasion}"></option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Fragrance Notes</label>
                        <div class="row">
                            <div th:each="note : ${commonNotes}" class="col-md-3 mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" 
                                           th:id="${'note_' + note}"
                                           th:value="${note}"
                                           th:field="*{fragranceNotes}">
                                    <label class="form-check-label" th:for="${'note_' + note}" th:text="${note}"></label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a th:href="@{/perfumes}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-success">Add Perfume</button>
                    </div>
                    <div class="mb-3">
    <label for="collectionStatus" class="form-label">Collection Status</label>
    <select class="form-select" id="collectionStatus" th:field="*{collectionStatus}">
        <option value="">Select Status</option>
        <option value="OWNED">Owned</option>
        <option value="WISHLIST">Wishlist</option>
        <option value="FINISHED">Finished</option>
    </select>
</div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
