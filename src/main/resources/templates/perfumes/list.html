<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Perfume Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">🎵 Fragrance Tracker</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>My Perfume Collection</h1>
            <a th:href="@{/perfumes/add}" class="btn btn-success">+ Add New Perfume</a>
        </div>
        
        <div th:if="${perfumes.empty}" class="alert alert-info">
            No perfumes in your collection yet. <a th:href="@{/perfumes/add}">Add your first perfume!</a>
        </div>
        
        <div th:unless="${perfumes.empty}" class="row">
            <div th:each="perfume : ${perfumes}" class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${perfume.name}">Perfume Name</h5>
                        <h6 class="card-subtitle mb-2 text-muted" th:text="${perfume.brand}">Brand</h6>
                        
                        <p class="card-text" th:if="${perfume.description}" th:text="${perfume.description}">Description</p>
                        
                        <div class="mb-2">
                            <span th:if="${perfume.season}" class="badge bg-primary" th:text="${perfume.season}">Season</span>
                            <span th:if="${perfume.occasion}" class="badge bg-secondary" th:text="${perfume.occasion}">Occasion</span>
                        </div>
                        
                        <div th:if="${not perfume.fragranceNotes.empty}">
                            <small class="text-muted">Notes: </small>
                            <span th:each="note, stat : ${perfume.fragranceNotes}" 
                                  th:text="${note + (stat.last ? '' : ', ')}" 
                                  class="fst-italic"></span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/perfumes/edit/{id}(id=${perfume.id})}" class="btn btn-sm btn-primary">Edit</a>
                        <a th:href="@{/perfumes/delete/{id}(id=${perfume.id})}" 
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this perfume?')">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
