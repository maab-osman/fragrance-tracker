<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Fragrance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-error {
            color: #dc3545;
            font-size: 0.875rem;
            display: none;
        }
        .form-control.is-invalid ~ .form-error {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h2 class="text-center mb-4">Create Your Account</h2>
                
                <!-- Error Display -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Error!</strong> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- Registration Form -->
                <form id="registerForm" th:action="@{/register}" method="post" th:object="${user}" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" 
                               class="form-control" 
                               id="username" 
                               th:field="*{username}"
                               placeholder="Choose a username (3-50 chars)"
                               required
                               minlength="3"
                               maxlength="50"
                               th:classappend="${#fields.hasErrors('username')}? ' is-invalid' : ''">
                        <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" 
                               class="form-control" 
                               id="email" 
                               th:field="*{email}"
                               placeholder="Enter a valid email"
                               required
                               th:classappend="${#fields.hasErrors('email')}? ' is-invalid' : ''">
                        <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" 
                               class="form-control" 
                               id="password" 
                               th:field="*{password}"
                               placeholder="Min 6 characters"
                               required
                               minlength="6"
                               maxlength="100"
                               th:classappend="${#fields.hasErrors('password')}? ' is-invalid' : ''">
                        <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        <small class="text-muted d-block mt-1">Password must be at least 6 characters long</small>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 btn-lg">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">Already have an account? <a th:href="@{/login}" class="text-decoration-none"><strong>Login here</strong></a></p>
                </div>
                
                <div class="text-center mb-3">
                    <a th:href="@{/}" class="text-muted text-decoration-none">
                        <i class="fas fa-arrow-left"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Client-side validation for registration form
        const registerForm = document.getElementById('registerForm');
        
        registerForm.addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Clear previous errors
            document.querySelectorAll('.form-control').forEach(field => {
                field.classList.remove('is-invalid');
            });
            
            let isValid = true;
            
            // Validate username
            if (!username || username.length < 3) {
                document.getElementById('username').classList.add('is-invalid');
                isValid = false;
            }
            
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                document.getElementById('email').classList.add('is-invalid');
                isValid = false;
            }
            
            // Validate password
            if (!password || password.length < 6) {
                document.getElementById('password').classList.add('is-invalid');
                isValid = false;
            }
            
            // Prevent form submission if validation fails
            if (!isValid) {
                e.preventDefault();
                e.stopPropagation();
            }
        });
        
        // Real-time validation feedback
        document.getElementById('username').addEventListener('blur', function() {
            if (this.value.trim().length < 3 && this.value.trim().length > 0) {
                this.classList.add('is-invalid');
            } else {
                this.classList.remove('is-invalid');
            }
        });
        
        document.getElementById('email').addEventListener('blur', function() {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (this.value.trim().length > 0 && !emailRegex.test(this.value)) {
                this.classList.add('is-invalid');
            } else {
                this.classList.remove('is-invalid');
            }
        });
        
        document.getElementById('password').addEventListener('blur', function() {
            if (this.value.length < 6 && this.value.length > 0) {
                this.classList.add('is-invalid');
            } else {
                this.classList.remove('is-invalid');
            }
        });
    </script>
</body>
</html>
